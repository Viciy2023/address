name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Guards against encoding corruption and stale generated data. Both have
      # silently broken this project before.
      - name: Repository hygiene
        run: npm run hygiene

      - name: Astro and TypeScript check
        run: npm run check

      # Verifies every country generates, that city/division/postal stay
      # consistent, and that identifiers pass their format patterns.
      - name: Generator test suite
        run: npm test

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://example.com

      # The path Cloudflare Pages actually uses. CI above exercises the
      # SITE_URL override, which would mask a config that cannot read
      # CF_PAGES_URL — the exact bug that once shipped canonical tags pointing
      # at localhost. This step rebuilds the way Pages does and asserts the
      # origin is honoured.
      - name: Build as Cloudflare Pages does
        run: |
          npm run build
          node scripts/check-budget.mjs
        env:
          CF_PAGES: "1"
          CF_PAGES_BRANCH: main
          CF_PAGES_URL: https://ci-check.pages.dev

      # Every internal link must resolve to a built file, and every #anchor to
      # an id on the target page. Offline and deterministic.
      - name: Check internal links
        run: npm run links

      # Enforces the Cloudflare Pages file cap and the initial-JS budget, and
      # fails if any country loses its landing page or sitemap entry.
      - name: Check build budget and page coverage
        run: npm run budget
